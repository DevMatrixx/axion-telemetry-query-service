trigger: none

pool: Docker-VM_Pool

stages:
- stage: Build_Image
  displayName: Build Docker Image
  jobs:
  - job: Build
    displayName: Build React Docker Image
    steps:
    - task: DockerInstaller@0
      inputs:
        dockerVersion: '29.1.3'
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          docker build -t axion-telemetry-query-service:$(Build.BuildId) $(System.DefaultWorkingDirectory)
    
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)
          docker save axion-telemetry-query-service:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/axion-telemetry-query-service.tar


    - task: PublishPipelineArtifact@1
      displayName: Publish Docker Image Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/axion-telemetry-query-service.tar'
        artifact: 'docker-image'
        publishLocation: 'pipeline'

- stage: Push_ACR
  displayName: Push Image to ACR
  dependsOn: Build_Image
  jobs:
  - job: Push
    displayName: Push Docker Image
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          docker load -i $(Pipeline.Workspace)/docker-image/axion-telemetry-query-service.tar
    - task: AzureCLI@3
      displayName: Azure Login
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'Axion-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: 'az acr login --name todoclusteracr001'
    - task: Bash@3
      displayName: 'Tag Docker Image'
      inputs:
        targetType: inline
        script: |
          docker tag axion-telemetry-query-service:$(Build.BuildId) todoclusteracr001.azurecr.io/axion-telemetry-query-service:$(Build.BuildId)
          
    
    - task: Bash@3
      displayName: Push Docker Image to ACR
      inputs:
        targetType: 'inline'
        script: |
          docker push todoclusteracr001.azurecr.io/axion-telemetry-query-service:$(Build.BuildId)

    
    
    

    
